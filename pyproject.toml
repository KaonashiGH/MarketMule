[project]
name = "marketmule"
version = "0.1.0"
description = "MarketMule Discord bot"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["marketmule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
