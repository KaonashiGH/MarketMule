; Supervisor config: keeps the bot running and restarts it if it crashes.
; Install: cp deploy/marketmule.conf /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update
[program:marketmule]
directory=/home/marketmule
command=/home/marketmule/.venv/bin/python3 -m marketmule
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stdout_logfile=/var/log/marketmule.out.log
stderr_logfile=/var/log/marketmule.err.log
